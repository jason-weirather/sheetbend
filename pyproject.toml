[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetbend"
version = "0.2.1"
description = "Discover, inspect, and verify configured intelligence sources."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Jason L Weirather"}]
dependencies = ["click>=8.1,<9", "httpx>=0.28,<0.29", "jsonschema>=4.23,<5", "psutil>=7,<8", "rich>=14,<16"]

[project.optional-dependencies]
llm = ["llm>=0.35,<0.36", "openai>=3,<4"]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
sheetbend = "sheetbend.cli:main"

[project.urls]
Repository = "https://github.com/jason-weirather/sheetbend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sheetbend = ["schemas/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
