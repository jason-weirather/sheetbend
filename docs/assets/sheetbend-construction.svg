  <rect width="660" height="360" fill="white"/>
  <path d="M 487.153,256.347 C 499.178,246.423 506,232.758 506,215 C 506,206.142 504.46,197.932 501.633,190.583" fill="none" stroke="black" stroke-width="50" stroke-linecap="round"/>
  <path d="M 311.482,181.739 C 291.538,181.723 271.9,178.045 252,169 C 248.757,167.61 245.539,166.078 242.344,164.417" fill="none" stroke="black" stroke-width="50" stroke-linecap="round"/>
  <path d="M 242.218,250 C 249.479,250 256.739,250 264,250 C 281.757,250 298,252.919 313.618,256.838" fill="none" stroke="black" stroke-width="50" stroke-linecap="round"/>
  <path d="M 450.143,210.762 C 430.121,198.038 411.243,179.418 390.989,163.137" fill="none" stroke="black" stroke-width="40" stroke-linecap="round"/>
</mask>
</defs>
<rect width="1000" height="765" fill="#FFFFFF"/><text x="58" y="51" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#173348">SHEETBEND / CONSTRUCTION</text><text x="58" y="79" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#667D8C">The same geometry used in the logo, with the rope identities exposed.</text><g transform="translate(22 123) scale(1.3)"><g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path id="rope-a" d="M 140,250 C 181.333,250 222.667,250 264,250 C 318,250 358,277 409,277 C 466,277 506,258 506,215 C 506,171 468,143 423,157 C 360,178 307,194 252,169 C 231,160 211,145 192,128" stroke="#173348" stroke-width="40" mask="url(#mask-a)"/>
  <path id="rope-b-entry" d="M 630,226 C 585.333,226 540.667,226 496,226 C 446,226 410,170 362,143 C 322,117 285,119 278,160" stroke="#079F96" stroke-width="30" mask="url(#mask-bf)"/>
  <path id="rope-b-wrap-and-tuck" d="M 278,160 C 272,198 271,265 296,291 C 320,317 348,310 371,277 C 399,238 414,200 434,157 C 450,121 463,91 478,69" stroke="#079F96" stroke-width="30" mask="url(#mask-bw)"/>
</g></g><text x="65" y="270" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#173348">A: short end</text><path d="M 171,267 L 213,267 L 253,283" fill="none" stroke="#8799A4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="647" y="150" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#173348">B: short end</text><path d="M 688,161 L 688,180 L 650,201" fill="none" stroke="#8799A4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="493" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#173348">A: standing part</text><path d="M 185,487 L 204,487 L 204,476" fill="none" stroke="#8799A4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="782" y="363" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#173348">B: standing part</text><path d="M 837,375 L 854,397" fill="none" stroke="#8799A4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 744,296 L 704,296 L 568,367" fill="none" stroke="#8799A4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="744" y="258" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#667D8C">Return passes</text><text x="744" y="279" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#667D8C">UNDER its own part.</text><text x="500" y="575" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#173348">Both short ends emerge above the long standing parts.</text><path d="M 58,602 H 942" stroke="#DCE6EC"/><text x="58" y="640" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#079F96">1</text><text x="85" y="640" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#173348">One open bight</text><text x="85" y="668" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#667D8C">The thicker navy rope</text><text x="85" y="689" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#667D8C">never crosses itself.</text><text x="362" y="640" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#079F96">2</text><text x="389" y="640" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#173348">Around BOTH legs</text><text x="389" y="668" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#667D8C">The teal rope passes behind</text><text x="389" y="689" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#667D8C">the two navy legs.</text><text x="666" y="640" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#079F96">3</text><text x="693" y="640" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#173348">Under its own part</text><text x="693" y="668" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#667D8C">The rising teal return lies below</text><text x="693" y="689" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#667D8C">the diagonal teal entry.</text><text x="58" y="737" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#667D8C">Original vector geometry. Topology checked against Animated Knots by Grog and NetKnots.</text>
</svg>
