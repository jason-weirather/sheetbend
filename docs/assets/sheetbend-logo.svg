<svg xmlns="http://www.w3.org/2000/svg" width="680" height="446" viewBox="0 0 680 446" role="img" aria-labelledby="title desc">
<title id="title">Sheetbend</title>
<desc id="desc">Two separate ropes joined in a single sheet bend. The thick rope forms an open bight. The thin rope enters through the bight, wraps behind both legs, and returns under its own incoming part. Both short working ends are above the long standing parts. The crossing gaps are transparent. Original vector drawing, not a raster trace.</desc>
<!-- Crossing construction, following thin rope B from right standing end:
 A-over-B at bight nose; B-over-A at upper leg; A-over-B at back upper leg;
 A-over-B at back lower leg; B-over-A at lower return; B-entry-over-B-return
 at the self-tuck; B-over-A at upper exit. Two working ends above.
 B-entry and B-wrap are adjoining pieces of one continuous logical rope;
 their shared point is (278,160). Splitting lets masks show the self-tuck.
 No copied artwork, bitmap, embedded font, script, or external resource. -->
