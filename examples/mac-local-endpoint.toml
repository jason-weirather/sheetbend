# For a locally installed Ollama with `ollama pull qwen3.5:4b` completed.
# These are model declarations; verify the installed endpoint with `check --all`.
schema_version = 2
default_source = "laptop"

[sources.laptop]
protocol = "openai-compatible"
base_url = "http://127.0.0.1:11434/v1"
default_model = "qwen3.5:4b"
scope = "local"
auth = { type = "none" }
timeout_seconds = 120

[sources.laptop.rate_limit]
requests_per_minute = 60
max_concurrent = 1

[sources.laptop.models."qwen3.5:4b"]
capabilities = { streaming = true, json_schema = true, vision = true, tools = true }
